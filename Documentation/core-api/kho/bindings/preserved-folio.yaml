%YAML 1.2
---
title: Named folio preserved by KHO.

maintainers:
  - Mike Rapoport <rppt@kernel.org>
  - Changyuan Lyu <changyuanl@google.com>

description: |
  A named folio preserved by KHO across kexec. It usually contains an FDT blob
  that describes serialized states of a subsystem.

properties:
  folio:
    description: |
      physical address (u64) of a preserved folio.
  fdt:
    description: |
      physical address (u64) of a preserved folio containing a FDT blob.

anyOf:
  - required: [ folio ]
  - required: [ fdt ]

additionalProperties: false

examples:
  - |
    memblock {
            fdt = <0x80cc16 0x1000000>;
    };